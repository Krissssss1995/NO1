<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coded Particles</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            cursor: crosshair;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            box-sizing: border-box;
        }
        .shape-label {
            background: rgba(20, 20, 40, 0.5);
            border: 1px solid rgba(100, 150, 255, 0.25);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .controls {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 50px;
        }
        .change-btn {
            background: rgba(30, 60, 150, 0.4);
            border: 1px solid rgba(100, 150, 255, 0.5);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
        }
        .change-btn:hover {
            background: rgba(50, 90, 200, 0.6);
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.4);
            transform: translateY(-1px);
        }
        .color-palette {
            display: flex;
            gap: 10px;
            background: rgba(20, 20, 40, 0.5);
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }
        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .color-btn:hover {
            transform: scale(1.25);
            border-color: rgba(255,255,255,0.6);
        }
        .color-btn.active {
            border-color: white;
            box-shadow: 0 0 12px currentColor;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="shape-label" id="shape-text">Shape: Sphere</div>
        <div class="controls">
            <button class="change-btn" id="change-btn">Change Shape</button>
            <div class="color-palette">
                <div class="color-btn active" style="background: #ffaa00; color: #ffaa00;" data-color="#ffaa00"></div>
                <div class="color-btn" style="background: #aa44ff; color: #aa44ff;" data-color="#aa44ff"></div>
                <div class="color-btn" style="background: #00ffaa; color: #00ffaa;" data-color="#00ffaa"></div>
                <div class="color-btn" style="background: #ff4488; color: #ff4488;" data-color="#ff4488"></div>
                <div class="color-btn" style="background: linear-gradient(45deg, red, yellow, lime, cyan, blue, magenta); color: white;" data-color="rainbow"></div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <script>
        // --- 生成发光粒子纹理 ---
        function createGlowTexture(innerColor, outerColor, size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const half = size / 2;
            const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.05, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, innerColor);
            gradient.addColorStop(0.45, outerColor);
            gradient.addColorStop(0.55, 'rgba(255,220,150,0.25)');
            gradient.addColorStop(0.75, 'rgba(255,180,80,0.10)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            return new THREE.CanvasTexture(canvas);
        }

        const glowTexture = createGlowTexture('rgba(255,250,220,1)', 'rgba(255,200,80,0.7)', 128);

        // --- 初始化场景 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.0008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 250;
        camera.position.y = 30;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x050510);
        container.appendChild(renderer.domElement);

        // --- 鼠标追踪 ---
        const mouse = new THREE.Vector2(9999, 9999);
        const targetMouse = new THREE.Vector2(9999, 9999);

        document.addEventListener('mousemove', (e) => {
            targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        document.addEventListener('mouseleave', () => {
            targetMouse.x = 9999;
            targetMouse.y = 9999;
        });

        // 触屏支持
        document.addEventListener('touchmove', (e) => {
            targetMouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
        }, { passive: true });

        document.addEventListener('touchend', () => {
            targetMouse.x = 9999;
            targetMouse.y = 9999;
        });

        // --- 粒子系统设置 ---
        const particleCount = 80000;
        const shapes = ['Sphere', 'Cube', 'Torus', 'Galaxy', 'Wave'];
        let currentShapeIndex = 0;
        let isMorphing = false;

        const positions = {
            Sphere: new Float32Array(particleCount * 3),
            Cube: new Float32Array(particleCount * 3),
            Torus: new Float32Array(particleCount * 3),
            Galaxy: new Float32Array(particleCount * 3),
            Wave: new Float32Array(particleCount * 3)
        };

        // --- 几何形状生成 ---
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;

            // Sphere - 多层球壳更密集
            const shellChoice = Math.random();
            let r;
            if (shellChoice < 0.3) {
                r = 100 * Math.cbrt(Math.random());
            } else if (shellChoice < 0.7) {
                r = 85 + Math.random() * 25;
            } else {
                r = 95 + Math.random() * 15;
            }
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            positions.Sphere[i3] = r * Math.sin(phi) * Math.cos(theta);
            positions.Sphere[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions.Sphere[i3 + 2] = r * Math.cos(phi);

            // Cube
            const size = 70;
            positions.Cube[i3] = (Math.random() - 0.5) * 2 * size;
            positions.Cube[i3 + 1] = (Math.random() - 0.5) * 2 * size;
            positions.Cube[i3 + 2] = (Math.random() - 0.5) * 2 * size;

            // Torus
            const R = 80;
            const r2 = 30 * Math.random();
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI * 2;
            positions.Torus[i3] = (R + r2 * Math.cos(v)) * Math.cos(u);
            positions.Torus[i3 + 1] = r2 * Math.sin(v);
            positions.Torus[i3 + 2] = (R + r2 * Math.cos(v)) * Math.sin(u);

            // Galaxy
            const arms = 3;
            const radius = Math.random() * 150;
            const spinAngle = radius * 0.05;
            const branchAngle = ((i % arms) / arms) * Math.PI * 2;
            const randomX = (Math.random() - 0.5) * (150 - radius) * 0.2;
            const randomY = (Math.random() - 0.5) * 15;
            const randomZ = (Math.random() - 0.5) * (150 - radius) * 0.2;
            positions.Galaxy[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions.Galaxy[i3 + 1] = randomY;
            positions.Galaxy[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            // Wave
            const gridSize = 283;
            const gridX = (i % gridSize) - 141;
            const gridZ = Math.floor(i / gridSize) - 141;
            positions.Wave[i3] = gridX * 1.5;
            positions.Wave[i3 + 1] = Math.sin(gridX * 0.05) * 20 + Math.cos(gridZ * 0.05) * 20;
            positions.Wave[i3 + 2] = gridZ * 1.5;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions.Sphere, 3));
        geometry.setAttribute('aTarget', new THREE.BufferAttribute(positions.Cube, 3));

        const randoms = new Float32Array(particleCount);
        const sizes = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            randoms[i] = Math.random();
            sizes[i] = 0.3 + Math.random() * 1.7;
        }
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
        geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

        // --- 着色器材质 ---
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uProgress: { value: 0 },
                uTime: { value: 0 },
                uColor: { value: new THREE.Color('#ffaa00') },
                uColorMode: { value: 0.0 },
                uMouse: { value: new THREE.Vector2(9999, 9999) },
                uTexture: { value: glowTexture },
                uWaveStrength: { value: 0.0 }
            },
            vertexShader: `
                uniform float uProgress;
                uniform float uTime;
                uniform vec2 uMouse;
                uniform float uWaveStrength;

                attribute vec3 aTarget;
                attribute float aRandom;
                attribute float aSize;

                varying vec3 vColor;
                varying float vAlpha;
                varying float vDistToMouse;

                void main() {
                    float delay = aRandom * 0.25;
                    float p = clamp((uProgress - delay) / 0.75, 0.0, 1.0);
                    p = p < 0.5 ? 4.0 * p * p * p : 1.0 - pow(-2.0 * p + 2.0, 3.0) / 2.0;

                    vec3 pos = mix(position, aTarget, p);

                    // 波浪形态的实时动画
                    float waveY = sin(pos.x * 0.04 + uTime * 1.5) * 25.0
                                + cos(pos.z * 0.04 + uTime * 1.2) * 25.0
                                + sin(pos.x * 0.08 + uTime * 0.7) * 12.0;
                    pos.y += waveY * uWaveStrength;

                    // 微弱的呼吸浮动
                    float breathe = sin(uTime * 1.8 + aRandom * 6.28) * 2.0;
                    pos.x += breathe * 0.3;
                    pos.y += breathe * 0.3;
                    pos.z += breathe * 0.3;

                    // 鼠标吸引力 - 粒子向鼠标位置微移
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    vec4 screenPos = projectionMatrix * mvPosition;
                    vec2 screenUV = screenPos.xy / screenPos.w;

                    float distToMouse = length(screenUV - uMouse);
                    vDistToMouse = distToMouse;

                    float influence = smoothstep(1.2, 0.0, distToMouse) * 0.06;
                    pos.x += uMouse.x * influence * 80.0;
                    pos.y += uMouse.y * influence * 80.0;

                    mvPosition = modelViewMatrix * vec4(pos, 1.0);

                    // 粒子大小：基础大小 × 个体差异 × 距离衰减 × 鼠标靠近放大
                    float baseSize = 380.0 * aSize;
                    float mouseBoost = 1.0 + smoothstep(0.8, 0.0, distToMouse) * 1.2;
                    gl_PointSize = (baseSize * mouseBoost / -mvPosition.z);
                    gl_PointSize = clamp(gl_PointSize, 1.5, 20.0);

                    gl_Position = projectionMatrix * mvPosition;

                    // 闪烁效果
                    float twinkle = sin(uTime * 3.0 + aRandom * 20.0) * 0.15 + 0.85;
                    twinkle += sin(uTime * 7.0 + aRandom * 33.0) * 0.08;
                    vAlpha = clamp(twinkle, 0.65, 1.0);

                    // 彩虹颜色
                    vColor = vec3(
                        sin(pos.x * 0.015 + uTime * 0.6) * 0.5 + 0.5,
                        sin(pos.y * 0.015 + uTime * 0.7 + 2.0) * 0.5 + 0.5,
                        sin(pos.z * 0.015 + uTime * 0.8 + 4.0) * 0.5 + 0.5
                    );
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                uniform float uColorMode;
                uniform sampler2D uTexture;
                varying vec3 vColor;
                varying float vAlpha;
                varying float vDistToMouse;

                void main() {
                    vec4 texColor = texture2D(uTexture, gl_PointCoord);

                    // 鼠标附近的粒子更亮（在基础高亮上叠加）
                    float mouseGlow = 1.0 + smoothstep(0.6, 0.0, vDistToMouse) * 0.6;

                    vec3 finalColor = mix(uColor, vColor, uColorMode);
                    // 核心大幅加亮：向白色混合
                    finalColor = mix(finalColor, vec3(1.0), 0.5);
                    finalColor = finalColor * mouseGlow;

                    float alpha = texColor.a * vAlpha * 1.3;
                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 背景星场 ---
        const starCount = 2000;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 600;
            starPositions[i + 1] = (Math.random() - 0.5) * 400;
            starPositions[i + 2] = -100 - Math.random() * 300;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xaaccff,
            size: 0.6,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- UI 交互 ---
        const changeBtn = document.getElementById('change-btn');
        const shapeText = document.getElementById('shape-text');
        const colorBtns = document.querySelectorAll('.color-btn');

        changeBtn.addEventListener('click', () => {
            if (isMorphing) return;
            isMorphing = true;
            shapeText.innerText = "Morphing...";

            const nextIndex = (currentShapeIndex + 1) % shapes.length;
            const currentShapeName = shapes[currentShapeIndex];
            const nextShapeName = shapes[nextIndex];

            const currentIsWave = currentShapeName === 'Wave';
            const nextIsWave = nextShapeName === 'Wave';

            geometry.attributes.position.array.set(positions[currentShapeName]);
            geometry.attributes.position.needsUpdate = true;

            geometry.attributes.aTarget.array.set(positions[nextShapeName]);
            geometry.attributes.aTarget.needsUpdate = true;

            material.uniforms.uProgress.value = 0;

            // 控制波浪强度：仅在目标是 Wave 时开启
            if (nextIsWave) {
                anime({
                    targets: material.uniforms.uWaveStrength,
                    value: 1.0,
                    duration: 2500,
                    easing: 'easeInOutCubic'
                });
            } else if (currentIsWave) {
                anime({
                    targets: material.uniforms.uWaveStrength,
                    value: 0.0,
                    duration: 2500,
                    easing: 'easeInOutCubic'
                });
            }

            anime({
                targets: material.uniforms.uProgress,
                value: 1,
                duration: 2500,
                easing: 'easeInOutCubic',
                complete: () => {
                    isMorphing = false;
                    currentShapeIndex = nextIndex;
                    shapeText.innerText = `Shape: ${nextShapeName}`;
                }
            });
        });

        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                colorBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const colorVal = e.target.getAttribute('data-color');

                if (colorVal === 'rainbow') {
                    anime({
                        targets: material.uniforms.uColorMode,
                        value: 1.0,
                        duration: 1000,
                        easing: 'easeInOutSine'
                    });
                } else {
                    anime({
                        targets: material.uniforms.uColorMode,
                        value: 0.0,
                        duration: 1000,
                        easing: 'easeInOutSine'
                    });

                    const targetColor = new THREE.Color(colorVal);
                    anime({
                        targets: material.uniforms.uColor.value,
                        r: targetColor.r,
                        g: targetColor.g,
                        b: targetColor.b,
                        duration: 1000,
                        easing: 'easeOutQuart'
                    });
                }
            });
        });

        // --- 动画循环 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            material.uniforms.uTime.value = elapsedTime;

            // 平滑鼠标位置
            mouse.x += (targetMouse.x - mouse.x) * 0.08;
            mouse.y += (targetMouse.y - mouse.y) * 0.08;
            material.uniforms.uMouse.value.set(mouse.x, mouse.y);

            // 粒子系统缓慢自转
            particles.rotation.y = elapsedTime * 0.04;
            particles.rotation.z = Math.sin(elapsedTime * 0.15) * 0.05;
            particles.rotation.x = 0;

            // 背景星星反向缓慢旋转
            stars.rotation.y = -elapsedTime * 0.015;
            stars.rotation.x = Math.sin(elapsedTime * 0.1) * 0.03;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
