<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coded Particles - Morphing Shapes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            box-sizing: border-box;
        }

        .status-badge {
            background: rgba(20, 20, 30, 0.7);
            border: 1px solid rgba(100, 100, 255, 0.3);
            color: #dcdcdc;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: auto; /* Enable clicks for controls */
        }

        #morph-btn {
            background: rgba(40, 60, 150, 0.8);
            border: 1px solid rgba(100, 150, 255, 0.5);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(40, 60, 150, 0.5);
        }

        #morph-btn:hover {
            background: rgba(60, 80, 180, 0.9);
            transform: scale(1.05);
        }

        #morph-btn:active {
            transform: scale(0.95);
        }

        .color-picker {
            display: flex;
            gap: 15px;
            background: rgba(20, 20, 30, 0.5);
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.2);
            border-color: white;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div id="status" class="status-badge">Shape: Sphere (Click to morph)</div>
        
        <div class="controls">
            <button id="morph-btn">Change Shape</button>
            <div class="color-picker">
                <div class="color-btn active" style="background: #e6a146;" data-color="#e6a146" data-rainbow="0"></div>
                <div class="color-btn" style="background: #4caf50;" data-color="#4caf50" data-rainbow="0"></div>
                <div class="color-btn" style="background: #9c27b0;" data-color="#9c27b0" data-rainbow="0"></div>
                <div class="color-btn" style="background: linear-gradient(45deg, red, yellow, green, blue, purple);" data-rainbow="1"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Basic Setup & Configuration ---
        const container = document.getElementById('canvas-container');
        const statusText = document.getElementById('status');
        const morphBtn = document.getElementById('morph-btn');
        const colorBtns = document.querySelectorAll('.color-btn');

        const PARTICLE_COUNT = 15000;
        let currentShapeIndex = 0;
        let isMorphing = false;

        const SHAPES = [
            { name: 'Sphere', getPositions: getSpherePositions },
            { name: 'Cube', getPositions: getCubePositions },
            { name: 'Torus', getPositions: getTorusPositions },
            { name: 'Pyramid', getPositions: getPyramidPositions },
            { name: 'Galaxy', getPositions: getGalaxyPositions }
        ];

        // Three.js Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 150;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- 2. Math & Geometry Generators ---
        function getSpherePositions() {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const radius = 50;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                positions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
                positions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
                positions[i * 3 + 2] = radius * Math.cos(phi);
            }
            return positions;
        }

        function getCubePositions() {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const size = 45;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Distribute on faces
                let x, y, z;
                let face = Math.floor(Math.random() * 6);
                let u = (Math.random() - 0.5) * 2 * size;
                let v = (Math.random() - 0.5) * 2 * size;
                
                if (face === 0) { x = size; y = u; z = v; }
                else if (face === 1) { x = -size; y = u; z = v; }
                else if (face === 2) { x = u; y = size; z = v; }
                else if (face === 3) { x = u; y = -size; z = v; }
                else if (face === 4) { x = u; y = v; z = size; }
                else { x = u; y = v; z = -size; }

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            return positions;
        }

        function getTorusPositions() {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const R = 40;
            const r = 15;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI * 2;
                positions[i * 3] = (R + r * Math.cos(v)) * Math.cos(u);
                positions[i * 3 + 1] = (R + r * Math.cos(v)) * Math.sin(u);
                positions[i * 3 + 2] = r * Math.sin(v);
            }
            return positions;
        }

        function getPyramidPositions() {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const size = 50;
            const height = 60;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let face = Math.floor(Math.random() * 5); // 4 sides + 1 base
                let u = Math.random();
                let v = Math.random();
                
                // Keep points nicely distributed using barycentric coordinates for triangles
                if (u + v > 1) { u = 1 - u; v = 1 - v; }
                
                let x, y, z;
                if (face === 0) { // Base
                    x = (Math.random() - 0.5) * size * 2;
                    y = -height / 2;
                    z = (Math.random() - 0.5) * size * 2;
                } else { // Sides
                    let px = (face === 1 || face === 2) ? (face === 1 ? size : -size) : 0;
                    let pz = (face === 3 || face === 4) ? (face === 3 ? size : -size) : 0;
                    
                    x = u * px + v * 0 + (1 - u - v) * ((face > 2) ? (Math.random()-0.5)*size*2 : px);
                    y = u * (-height/2) + v * (height/2) + (1 - u - v) * (-height/2);
                    z = u * pz + v * 0 + (1 - u - v) * ((face <= 2) ? (Math.random()-0.5)*size*2 : pz);
                }

                positions[i * 3] = x;
                positions[i * 3 + 1] = y - 10; // offset
                positions[i * 3 + 2] = z;
            }
            return positions;
        }

        function getGalaxyPositions() {
             const positions = new Float32Array(PARTICLE_COUNT * 3);
             for(let i = 0; i < PARTICLE_COUNT; i++) {
                const radius = Math.random() * 60;
                const spinAngle = radius * 0.15;
                const branchAngle = ((i % 3) / 3) * Math.PI * 2; // 3 arms
                
                const randX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 10;
                const randY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 10;
                const randZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 10;

                positions[i * 3] = Math.cos(branchAngle + spinAngle) * radius + randX;
                positions[i * 3 + 1] = randY;
                positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randZ;
             }
             return positions;
        }

        // --- 3. Background Starfield ---
        const bgGeometry = new THREE.BufferGeometry();
        const bgCount = 2000;
        const bgPositions = new Float32Array(bgCount * 3);
        for(let i=0; i < bgCount*3; i++) {
            bgPositions[i] = (Math.random() - 0.5) * 600;
        }
        bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        const bgMaterial = new THREE.PointsMaterial({ size: 1.5, color: 0x555555, transparent: true, opacity: 0.6 });
        const bgParticles = new THREE.Points(bgGeometry, bgMaterial);
        scene.add(bgParticles);


        // --- 4. Main Particles & Custom GLSL Shader ---
        const geometry = new THREE.BufferGeometry();
        
        // Setup initial position (Sphere) and target position (Sphere - initially same)
        const initialPositions = SHAPES[0].getPositions();
        geometry.setAttribute('position', new THREE.BufferAttribute(initialPositions, 3));
        geometry.setAttribute('targetPosition', new THREE.BufferAttribute(new Float32Array(initialPositions), 3));
        
        // Random offsets for organic morphing feeling
        const randoms = new Float32Array(PARTICLE_COUNT);
        for(let i=0; i<PARTICLE_COUNT; i++) randoms[i] = Math.random();
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uTransition: { value: 0 },
                uColor: { value: new THREE.Color('#e6a146') },
                uIsRainbow: { value: 0.0 }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uTransition;
                
                attribute vec3 targetPosition;
                attribute float aRandom;
                
                varying vec3 vPos;
                varying float vRandom;

                void main() {
                    vRandom = aRandom;
                    
                    // Add some noise and organic movement during transition
                    vec3 start = position;
                    vec3 end = targetPosition;
                    
                    // Delay based on random value for a "swarm" effect
                    float delay = aRandom * 0.5;
                    float t = clamp((uTransition - delay) / 0.5, 0.0, 1.0);
                    
                    // Easing (Cubic in-out)
                    float easeT = t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;

                    // Morph position
                    vec3 morphed = mix(start, end, easeT);
                    
                    // Add slight floating animation based on time
                    morphed.y += sin(uTime * 2.0 + aRandom * 10.0) * 1.5;

                    vec4 mvPosition = modelViewMatrix * vec4(morphed, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // Size attenuation
                    gl_PointSize = (12.0 * aRandom + 4.0) * (100.0 / -mvPosition.z);
                    
                    vPos = morphed;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                uniform float uIsRainbow;
                
                varying vec3 vPos;
                varying float vRandom;

                void main() {
                    // Make particles circular with a soft edge
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float distance = length(coord);
                    if (distance > 0.5) discard;

                    // Compute Rainbow effect based on position
                    vec3 rainbow = vec3(
                        abs(sin(vPos.x * 0.05)),
                        abs(cos(vPos.y * 0.05)),
                        abs(sin(vPos.z * 0.05))
                    );

                    vec3 finalColor = mix(uColor, rainbow, uIsRainbow);
                    
                    // Add variation based on random attribute
                    finalColor += (vRandom * 0.2);

                    float alpha = 1.0 - (distance * 2.0); // Soft edge
                    gl_FragColor = vec4(finalColor, alpha * 0.8);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 5. Interactions & Anime.js Morphing Logic ---
        function morphTo(shapeIndex) {
            if (isMorphing) return;
            isMorphing = true;
            statusText.innerText = "Morphing...";

            const targetShape = SHAPES[shapeIndex];
            const newPositions = targetShape.getPositions();
            
            // Set the new target positions in the BufferGeometry
            geometry.attributes.targetPosition.array.set(newPositions);
            geometry.attributes.targetPosition.needsUpdate = true;

            // Use Anime.js to tween the Uniform value from 0 to 1
            let transitionObj = { value: 0 };
            
            anime({
                targets: transitionObj,
                value: 1,
                duration: 2000,
                easing: 'easeInOutSine',
                update: function() {
                    material.uniforms.uTransition.value = transitionObj.value;
                },
                complete: function() {
                    // Once animation is done, copy target to current position array
                    geometry.attributes.position.array.set(newPositions);
                    geometry.attributes.position.needsUpdate = true;
                    
                    // Reset transition uniform for the next morph
                    material.uniforms.uTransition.value = 0;
                    
                    isMorphing = false;
                    statusText.innerText = `Shape: ${targetShape.name} (Click to morph)`;
                }
            });
        }

        morphBtn.addEventListener('click', () => {
            currentShapeIndex = (currentShapeIndex + 1) % SHAPES.length;
            morphTo(currentShapeIndex);
        });

        // Color Picker Logic
        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Update UI
                colorBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                // Update Shader Uniforms
                const isRainbow = parseInt(e.target.dataset.rainbow);
                material.uniforms.uIsRainbow.value = isRainbow;
                
                if (!isRainbow) {
                    const colorHex = e.target.dataset.color;
                    material.uniforms.uColor.value.set(colorHex);
                }
            });
        });

        // --- 6. Render Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            material.uniforms.uTime.value = elapsedTime;

            // Slowly rotate the entire system
            scene.rotation.y += 0.002;
            scene.rotation.x = Math.sin(elapsedTime * 0.5) * 0.1;
            
            // Slower background rotation
            bgParticles.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
